name: CUDA tests (simulated H100)

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the CUDA backend and runs its GoogleTest unit tests on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behaviour or timing, so it complements real-GPU testing
# and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/libmpcd/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: gpu-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-sim:
    name: CUDA 13.0, simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@deff5781e8adfd83dec98dd5242dcbc96a564773 # v0.1.10
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"
          library-path: "false"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgtest-dev pybind11-dev python3-dev

      # The simulator runs PTX, so the hard-coded SASS architecture lists are
      # replaced with 90-virtual (compute_90 PTX only) in this checkout, and
      # the shared CUDA runtime is selected as the simulator requires.
      # test_simulation_kernels compares positions to the velocity with exact
      # float equality, but the kernel wraps them with fmodf(x + 15, 10) - 5,
      # which rounds at the 1e-7 level, so that comparison uses a 1e-5 tolerance.
      # CUDA is enabled and CUDAToolkit_FOUND is set inside src/libmpcd, so
      # neither is visible in tests/, where add_cuda_test needs both: the CUDA
      # language is added to the top-level project and the flag is passed in.
      - name: Configure and build the CUDA unit tests
        run: |
          sed -i 's/CUDA_ARCHITECTURES "75;80;86;89;90"/CUDA_ARCHITECTURES "90-virtual"/' \
            src/libmpcd/cuda_backend/CMakeLists.txt
          sed -i 's/CUDA_ARCHITECTURES 70 75 80/CUDA_ARCHITECTURES 90-virtual/' \
            tests/CMakeLists.txt
          sed -i -E 's/EXPECT_EQ\(particles\[0\]\.position\.([xyz]), test_velocity\.[xyz]\)/EXPECT_NEAR(particles[0].position.\1, test_velocity.\1, 1e-5)/' \
            tests/unit/cuda/test_simulation_kernels.cu
          test "$(grep -c 'EXPECT_NEAR(particles' tests/unit/cuda/test_simulation_kernels.cu)" -eq 3
          sed -i 's/LANGUAGES CXX$/LANGUAGES CXX CUDA/' CMakeLists.txt
          grep -q 'LANGUAGES CXX CUDA' CMakeLists.txt
          grep -q 'CUDA_ARCHITECTURES "90-virtual"' src/libmpcd/cuda_backend/CMakeLists.txt
          grep -q 'CUDA_ARCHITECTURES 90-virtual' tests/CMakeLists.txt
          cmake -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release \
            -DSKBUILD_PROJECT_NAME=cudampcd -DSKBUILD_PROJECT_VERSION=1.0.0 \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared -DCUDAToolkit_FOUND=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
          cmake --build build --target test_gpu_arrays test_simulation_kernels -j3

      # Each test binary must really run on the simulated device: exit code 0,
      # the virtual GPU reported, the expected number of tests passed, and no
      # skipped or failed test, simulator error or missing device.
      - name: Run the CUDA unit tests
        run: |
          set -o pipefail
          check() {
            name=$1; expected=$2
            echo "##### $name"
            vgpu run "./build/tests/$name" 2>&1 | tee "run_$name.log"
            grep -q 'virtual GPU platform initialized' "run_$name.log"
            grep -q "^\[  PASSED  \] $expected test" "run_$name.log"
            if grep -E 'VirtualGPU error|no CUDA-capable device|no device|FAILED|SKIPPED|CUDA error' "run_$name.log"; then
              echo "unexpected output in $name"; exit 1
            fi
          }
          check test_gpu_arrays 3
          check test_simulation_kernels 1
